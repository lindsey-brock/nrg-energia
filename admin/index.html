<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Admin — NRG Energia</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="canvas.css">
  <style>
    /* ── canvas editor chrome ─────────────────────────────────────────────── */
    .canvas { background:var(--white); border:1px solid var(--warm-gray); border-radius:var(--radius);
              padding:30px 34px 34px; position:relative; }
    .canvas.drop-hero { outline:2px dashed var(--green-mid); outline-offset:-6px; }
    .canvas [contenteditable]:focus { outline:none; background:#fbfdfc; box-shadow:0 0 0 2px var(--green-pale); border-radius:4px; }
    .canvas [contenteditable]:empty::before { content:'Scrivi qui…'; color:var(--text-light); }
    .canvas-label { font-size:10px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase;
                    color:var(--text-light); margin-bottom:6px; }
    .canvas .sec { margin-top:26px; padding-top:18px; border-top:1px dashed var(--warm-gray); }
    .sec-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
    .sec-num { font-size:10px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--text-light); }
    .sec-del { background:none; border:none; cursor:pointer; font-size:11.5px; color:var(--text-light);
               font-family:'DM Sans',sans-serif; }
    .sec-del:hover { color:var(--red); }
    .blk { position:relative; padding:6px 34px 6px 26px; border-radius:6px; }
    .blk:hover { background:#fcfcfa; }
    .blk.dragging { opacity:.4; }
    .blk.over { box-shadow:inset 0 2px 0 var(--green-mid); }
    .blk-handle { position:absolute; left:4px; top:10px; cursor:grab; color:var(--warm-gray);
                  font-size:14px; line-height:1; user-select:none; }
    .blk:hover .blk-handle { color:var(--text-light); }
    .blk-kind { position:absolute; right:34px; top:8px; font-size:9.5px; letter-spacing:1.2px;
                text-transform:uppercase; color:var(--text-light); opacity:0; transition:opacity .15s; }
    .blk:hover .blk-kind { opacity:1; }
    .blk-del { position:absolute; right:8px; top:4px; background:none; border:none; cursor:pointer;
               font-size:17px; line-height:1; color:var(--warm-gray); opacity:0; transition:opacity .15s; }
    .blk:hover .blk-del { opacity:1; }
    .blk-del:hover { color:var(--red); }
    .blk-unknown { font-size:13px; color:var(--text-light); font-style:italic; padding:8px 0; }
    .img-empty { aspect-ratio:16/9; background:var(--off-white); border:2px dashed var(--warm-gray);
                 border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center;
                 color:var(--text-light); font-size:13.5px; }
    .article-inline-figure.drop img, .article-inline-figure.drop .img-empty { outline:2px dashed var(--green-mid); }
    .icon-slot { display:inline-flex; color:var(--green-mid); flex-shrink:0; }
    .add-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
    .add-btn, .add-section { font-family:'DM Sans',sans-serif; font-size:12.5px; background:var(--off-white);
      border:1px solid var(--warm-gray); color:var(--text-mid); border-radius:50px; padding:6px 14px; cursor:pointer; }
    .add-btn:hover, .add-section:hover { border-color:var(--green-mid); color:var(--green-dark); background:var(--green-pale); }
    .add-section { margin-top:24px; padding:9px 20px; font-size:13.5px; }
    .canvas-notice { position:sticky; top:8px; z-index:5; display:none; font-size:13px; padding:9px 14px;
                     border-radius:var(--radius-sm); margin-bottom:14px; }
    .canvas-notice.show { display:block; }
    .canvas-notice.busy { background:var(--off-white); color:var(--text-mid); }
    .canvas-notice.ok { background:var(--green-pale); color:var(--green-dark); }
    .canvas-notice.err { background:#fdf1f0; color:var(--red); }
    .lang-switch { display:inline-flex; background:var(--white); border:1px solid var(--warm-gray);
                   border-radius:50px; padding:3px; gap:2px; }
    .lang-switch button { font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; border:none;
      background:none; color:var(--text-mid); padding:6px 16px; border-radius:50px; cursor:pointer; }
    .lang-switch button.active { background:var(--green-dark); color:#fff; }
    .heading-row { display:flex; align-items:baseline; gap:10px; }
    .heading-row > :first-child { flex:1; }
    .level-pick { font-family:'DM Sans',sans-serif; font-size:11px; border:1px solid var(--warm-gray);
                  background:var(--white); border-radius:5px; padding:2px 5px; color:var(--text-light); cursor:pointer; }
    .hero-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .hero-thumb { width:100%; aspect-ratio:16/7; object-fit:cover; border-radius:var(--radius-sm);
                  display:block; background:var(--off-white); }
    .pick-btn { font-family:'DM Sans',sans-serif; font-size:11.5px; background:var(--white);
                border:1px solid var(--warm-gray); color:var(--text-mid); border-radius:50px;
                padding:5px 12px; cursor:pointer; margin-top:8px; }
    .pick-btn:hover { border-color:var(--green-mid); color:var(--green-dark); background:var(--green-pale); }
    .lib-overlay { position:fixed; inset:0; background:rgba(10,25,18,.6); z-index:100;
                   display:flex; align-items:center; justify-content:center; padding:24px; }
    .lib { background:var(--white); border-radius:var(--radius); width:100%; max-width:760px;
           max-height:80vh; display:flex; flex-direction:column; overflow:hidden; }
    .lib-head { display:flex; justify-content:space-between; align-items:center; padding:16px 20px;
                border-bottom:1px solid var(--warm-gray); font-family:'Syne',sans-serif; }
    .lib-close { background:none; border:none; font-size:22px; line-height:1; cursor:pointer; color:var(--text-light); }
    .lib-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;
                padding:18px 20px; overflow-y:auto; }
    .lib-item { border:1px solid var(--warm-gray); border-radius:var(--radius-sm); overflow:hidden;
                background:none; padding:0; cursor:pointer; aspect-ratio:3/2; }
    .lib-item:hover { border-color:var(--green-mid); box-shadow:0 4px 14px rgba(0,0,0,.1); }
    .lib-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .lib-empty { grid-column:1/-1; text-align:center; color:var(--text-light); font-size:14px; padding:36px 0; }
    .score { display:inline-flex; align-items:center; justify-content:center; min-width:44px;
             font-family:'Syne',sans-serif; font-weight:800; font-size:15px; padding:5px 9px;
             border-radius:8px; }
    .score.good { background:var(--green-pale); color:var(--green-dark); }
    .score.mid  { background:#fdf5e0; color:#8a5c10; }
    .score.bad  { background:#fdf1f0; color:var(--red); }
    .issue { font-size:13px; padding:5px 0 5px 20px; position:relative; color:var(--text-mid); }
    .issue::before { content:''; position:absolute; left:5px; top:12px; width:6px; height:6px; border-radius:50%; }
    .issue.error::before { background:var(--red); }
    .issue.warn::before  { background:var(--yellow); }
    .canvas-cols { display:grid; grid-template-columns:1fr; gap:18px; }
    @media (max-width:900px) { .canvas { padding:20px 18px 24px; } }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-dark:#1a4d2e; --green-mid:#2d7a4a; --green-light:#4aab6d; --green-pale:#e8f5ec;
      --yellow:#f5c842; --blue:#2563a8; --red:#b3261e;
      --off-white:#f7f6f2; --warm-gray:#ece9e3;
      --text-dark:#1a1a18; --text-mid:#4a4a44; --text-light:#888880;
      --white:#fff; --radius:12px; --radius-sm:8px;
    }
    body { font-family:'DM Sans',sans-serif; background:var(--off-white); color:var(--text-dark); line-height:1.6; }
    a { color: var(--green-mid); }
    .syne { font-family:'Syne',sans-serif; }

    /* ── sign in ─────────────────────────────────────────────────────────── */
    .gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
            background:linear-gradient(135deg,#1a5c3a 0%,#52b788 40%,#1a3a5c 70%,#0d1f3c 100%); }
    .gate-card { background:var(--white); border-radius:var(--radius); padding:40px; width:100%; max-width:400px;
                 box-shadow:0 24px 64px rgba(0,0,0,.28); }
    .gate-logo { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
    .dots { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; width:34px; }
    .dot { width:9px; height:9px; border-radius:50%; }
    .dot.y{background:var(--yellow)} .dot.b{background:var(--blue)} .dot.g{background:var(--green-light)}
    .gate h1 { font-family:'Syne',sans-serif; font-size:22px; font-weight:700; }
    .gate p.sub { font-size:14px; color:var(--text-mid); margin-bottom:24px; }

    label.f { display:block; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;
              color:var(--text-light); margin-bottom:7px; }
    input.f, textarea.f, select.f {
      width:100%; font-family:'DM Sans',sans-serif; font-size:15px; color:var(--text-dark);
      background:var(--off-white); border:1px solid var(--warm-gray); border-radius:var(--radius-sm);
      padding:11px 14px; transition:border-color .2s, background .2s; }
    input.f:focus, textarea.f:focus, select.f:focus { outline:none; border-color:var(--green-mid); background:var(--white); }
    textarea.f { resize:vertical; min-height:88px; line-height:1.65; }

    .btn { font-family:'DM Sans',sans-serif; font-size:15px; font-weight:600; border:none; cursor:pointer;
           border-radius:50px; padding:12px 26px; transition:background .2s, transform .15s; }
    .btn-primary { background:var(--green-dark); color:#fff; }
    .btn-primary:hover:not(:disabled) { background:var(--green-mid); }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .btn-ghost { background:transparent; border:1px solid var(--warm-gray); color:var(--text-mid); }
    .btn-ghost:hover { border-color:var(--green-mid); color:var(--green-dark); background:var(--green-pale); }
    .btn-sm { padding:8px 16px; font-size:13px; }
    .btn-danger { background:transparent; border:1px solid #e6c9c6; color:var(--red); }
    .btn-danger:hover { background:#fdf1f0; }

    .msg { font-size:13.5px; padding:11px 14px; border-radius:var(--radius-sm); margin-bottom:16px; display:none; }
    .msg.show { display:block; }
    .msg.err { background:#fdf1f0; color:var(--red); border:1px solid #e6c9c6; }
    .msg.ok  { background:var(--green-pale); color:var(--green-dark); border:1px solid #bfe3cc; }

    /* ── shell ───────────────────────────────────────────────────────────── */
    .app { display:none; min-height:100vh; grid-template-columns:236px 1fr; }
    .app.show { display:grid; }
    aside.side { background:#111a14; color:rgba(255,255,255,.62); padding:24px 0; display:flex; flex-direction:column; }
    .side-logo { display:flex; align-items:center; gap:10px; padding:0 22px 24px; }
    .side-logo span { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; color:#fff; letter-spacing:-.2px; }
    .side-tag { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:rgba(255,255,255,.35);
                padding:0 22px 10px; }
    nav.side-nav { display:flex; flex-direction:column; }
    nav.side-nav button { display:flex; align-items:center; gap:11px; background:none; border:none; cursor:pointer;
      font-family:'DM Sans',sans-serif; font-size:14.5px; color:rgba(255,255,255,.62); text-align:left;
      padding:12px 22px; border-left:3px solid transparent; transition:color .2s, background .2s; }
    nav.side-nav button:hover { color:#fff; background:rgba(255,255,255,.04); }
    nav.side-nav button.active { color:#fff; background:rgba(255,255,255,.07); border-left-color:var(--green-light); }
    .side-foot { margin-top:auto; padding:18px 22px 0; border-top:1px solid rgba(255,255,255,.08); }
    .side-foot a, .side-foot button { font-size:12.5px; color:rgba(255,255,255,.5); background:none; border:none;
      padding:5px 0; cursor:pointer; display:block; font-family:'DM Sans',sans-serif; text-decoration:none; }
    .side-foot a:hover, .side-foot button:hover { color:#fff; }

    main.work { padding:34px 40px 64px; max-width:1180px; overflow-x:hidden; }
    .work h2.title { font-family:'Syne',sans-serif; font-size:26px; font-weight:700; letter-spacing:-.01em; }
    .work p.lede { font-size:14.5px; color:var(--text-mid); margin-bottom:26px; }
    .head-row { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; }

    .card { background:var(--white); border:1px solid var(--warm-gray); border-radius:var(--radius); padding:22px 24px; margin-bottom:16px; }
    .card h3 { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; margin-bottom:3px; }
    .card .meta { font-size:12.5px; color:var(--text-light); }

    .list-row { display:flex; align-items:center; gap:16px; }
    .list-row img { width:76px; height:52px; object-fit:cover; border-radius:6px; background:var(--warm-gray); flex-shrink:0; }
    .list-row .grow { flex:1; min-width:0; }
    .pill { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
            padding:3px 10px; border-radius:50px; background:var(--green-pale); color:var(--green-dark); }
    .pill.blue { background:#e6f0fb; color:var(--blue); }
    .pill.grey { background:var(--warm-gray); color:var(--text-mid); }

    /* bilingual editor */
    .lang-cols { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    .lang-col h4 { font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;
                   color:var(--green-dark); margin-bottom:14px; padding-bottom:8px; border-bottom:2px solid var(--green-pale); }
    .field { margin-bottom:14px; }
    .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .editor-foot { position:sticky; bottom:0; background:var(--off-white); padding:16px 0 0; margin-top:8px;
                   border-top:1px solid var(--warm-gray); display:flex; gap:10px; align-items:center; }

    /* marketing */
    .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
    .stat { background:var(--white); border:1px solid var(--warm-gray); border-radius:var(--radius); padding:18px 20px; }
    .stat .k { font-size:10px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--text-light); }
    .stat .v { font-family:'Syne',sans-serif; font-size:27px; font-weight:800; color:var(--green-dark); line-height:1.2; margin-top:6px; }
    .stat .v.muted { color:var(--warm-gray); }
    .setup-list { list-style:none; margin:12px 0 0; }
    .setup-list li { position:relative; padding-left:24px; font-size:13.5px; color:var(--text-mid); margin-bottom:8px; }
    .setup-list li::before { content:''; position:absolute; left:6px; top:9px; width:6px; height:6px; border-radius:50%; background:var(--green-light); }
    code.env { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; background:var(--off-white);
               border:1px solid var(--warm-gray); border-radius:4px; padding:1px 6px; color:var(--text-dark); }
    .conn-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
    .status { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
              letter-spacing:.5px; text-transform:uppercase; }
    .status::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--text-light); }
    .status.on { color:var(--green-dark); } .status.on::before { background:var(--green-light); }
    .status.off { color:var(--text-light); }

    .empty { text-align:center; padding:52px 24px; color:var(--text-light); font-size:14.5px; }
    .spinner { display:inline-block; width:15px; height:15px; border:2px solid var(--warm-gray);
               border-top-color:var(--green-mid); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    @media (max-width:900px) {
      .app.show { grid-template-columns:1fr; }
      aside.side { flex-direction:row; align-items:center; overflow-x:auto; padding:10px 0; }
      .side-logo, .side-tag, .side-foot { display:none; }
      nav.side-nav { flex-direction:row; }
      main.work { padding:24px 20px 48px; }
      .lang-cols, .stat-grid, .row-2 { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<!-- ── sign in ─────────────────────────────────────────────────────────────── -->
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-logo">
      <div class="dots">
        <div class="dot y"></div><div class="dot y"></div><div class="dot y"></div>
        <div class="dot b"></div><div class="dot b"></div><div class="dot b"></div>
        <div class="dot g"></div><div class="dot g"></div><div class="dot g"></div>
      </div>
      <h1>NRG Energia</h1>
    </div>
    <p class="sub">Area riservata — gestione contenuti e marketing.</p>
    <div class="msg err" id="gateMsg"></div>
    <form id="gateForm">
      <div class="field">
        <label class="f" for="pw">Password</label>
        <input class="f" type="password" id="pw" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" style="width:100%" id="gateBtn" type="submit">Accedi</button>
    </form>
  </div>
</div>

<!-- ── dashboard ───────────────────────────────────────────────────────────── -->
<div class="app" id="app">
  <aside class="side">
    <div class="side-logo">
      <div class="dots">
        <div class="dot y"></div><div class="dot y"></div><div class="dot y"></div>
        <div class="dot b"></div><div class="dot b"></div><div class="dot b"></div>
        <div class="dot g"></div><div class="dot g"></div><div class="dot g"></div>
      </div>
      <span>NRG ADMIN</span>
    </div>
    <div class="side-tag">Contenuti</div>
    <nav class="side-nav" id="nav">
      <button data-view="blog" class="active">Blog</button>
      <button data-view="portfolio">Portfolio</button>
      <button data-view="seo">SEO</button>
      <div class="side-tag" style="padding-top:16px">Marketing</div>
      <button data-view="marketing">Andamento</button>
      <button data-view="connections">Connessioni</button>
    </nav>
    <div class="side-foot">
      <a href="../index" target="_blank" rel="noopener">Apri il sito ↗</a>
      <button id="logoutBtn">Esci</button>
    </div>
  </aside>
  <main class="work" id="work"></main>
</div>

<script type="module">
import { createCanvas } from './editor.js';

const $  = (s, r = document) => r.querySelector(s);
const el = (t, a = {}, kids = []) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const cloudinary = (id, w = 200) =>
  id ? `https://res.cloudinary.com/dmegrbq5k/image/upload/q_auto,f_auto,w_${w}/${id}` : '';

async function api(path, opts = {}) {
  const r = await fetch(`/api/admin/${path}`, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || `Request failed (${r.status})`), { code: data.code, status: r.status });
  return data;
}

// ── sign in ────────────────────────────────────────────────────────────────
const gate = $('#gate'), app = $('#app'), work = $('#work');
function showGate(message) {
  gate.style.display = 'flex'; app.classList.remove('show');
  if (message) { $('#gateMsg').textContent = message; $('#gateMsg').classList.add('show'); }
}
function showApp() { gate.style.display = 'none'; app.classList.add('show'); render(); }

$('#gateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#gateBtn'), msg = $('#gateMsg');
  msg.classList.remove('show'); btn.disabled = true; btn.textContent = 'Verifica…';
  try {
    await api('login', { method: 'POST', body: { password: $('#pw').value } });
    $('#pw').value = ''; showApp();
  } catch (err) {
    msg.textContent = err.code === 'not_configured'
      ? 'Admin non configurato: mancano ADMIN_PASSWORD e ADMIN_SESSION_SECRET.'
      : err.message;
    msg.classList.add('show');
  } finally { btn.disabled = false; btn.textContent = 'Accedi'; }
});

$('#logoutBtn').addEventListener('click', async () => {
  await api('logout', { method: 'POST' }).catch(() => {});
  location.reload();
});

// ── routing ────────────────────────────────────────────────────────────────
let view = 'blog';
$('#nav').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-view]');
  if (!b) return;
  view = b.dataset.view;
  [...$('#nav').querySelectorAll('button')].forEach((x) => x.classList.toggle('active', x === b));
  render();
});

const VIEWS = {};
function render() { work.innerHTML = ''; VIEWS[view](work); }

function header(parent, title, lede, action) {
  parent.append(el('div', { class: 'head-row' }, [
    el('div', {}, [el('h2', { class: 'title', html: title }), el('p', { class: 'lede', html: lede })]),
    action || null,
  ]));
}

function blankPost() {
  const now = new Date();
  const iso = now.toISOString().slice(0, 10);

  const enDate = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  const side = (lang) => ({
    slug: lang === 'it' ? 'nuovo-articolo' : 'new-article',
    tag: lang === 'it' ? 'Fotovoltaico' : 'Solar Power',
    dateLabel: lang === 'it' ? itDate : enDate,
    readLabel: lang === 'it' ? '2 min di lettura' : '2 min read',
    title: lang === 'it' ? 'Nuovo articolo' : 'New article',
    excerpt: '', metaDescription: '', imageAlt: '', inlineAlt: '', inlineCaption: '',
    lead: '',
    sections: [{
      id: 'sezione-1',
      heading: lang === 'it' ? 'Prima sezione' : 'First section',
      blocks: [{ type: 'p', html: '' }],
    }],
  });
  return {
    id: `post-${Date.now().toString(36)}`,
    published: false,          // starts as a draft: no page is generated until published
    date: iso, readMinutes: 2,
    category: 'fotovoltaico',

async function uploadImage(file) {
  const sig = await api('upload');
  if (!sig.configured) {
    throw new Error(`Upload non configurato: mancano ${sig.missing.join(', ')}`);
  }
  const fd = new FormData();
  fd.append('file', file);
  fd.append('api_key', sig.apiKey);
  fd.append('timestamp', sig.timestamp);
  fd.append('folder', sig.folder);
  fd.append('signature', sig.signature);
  const r = await fetch(sig.uploadUrl, { method: 'POST', body: fd });
  const body = await r.json();
  if (!r.ok) throw new Error(body.error?.message || 'Upload fallito');
  // store "<version>/<public_id>.<ext>" to match how the site references images
  return `v${body.version}/${body.public_id}.${body.format}`;
}

function openPostEditor(post, { isNew = false } = {}) {
  work.innerHTML = '';
  const draft = structuredClone(post);
  let lang = 'it';
  let dirty = isNew;

  const langSwitch = el('div', { class: 'lang-switch' });
  const msg = el('div', { class: 'msg' });
  const canvasHost = el('div');

  header(work,
    esc(draft.it.title.replace(/&mdash;/g, '—')),
    'Scrivi direttamente sulla pagina. Trascina un’immagine per sostituirla.',
    el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap' }, [
      langSwitch,
      el('button', { class: 'btn btn-ghost btn-sm', onclick: () => { if (confirmLeave()) render(); } }, ['← Tutti gli articoli']),
    ]));
  work.append(msg, canvasHost);

  const confirmLeave = () => !dirty || confirm('Ci sono modifiche non salvate. Uscire comunque?');

  function mountCanvas() {
    canvasHost.innerHTML = '';
    const { el: canvasEl } = createCanvas({
      lang, langData: draft[lang], post: draft,
      onDirty: () => { dirty = true; saveBtn.disabled = false; },
      uploadImage,
    });
    canvasHost.append(canvasEl);
  }

  for (const [code, label] of [['it', 'Italiano'], ['en', 'English']]) {
    langSwitch.append(el('button', {
      class: code === lang ? 'active' : '',
      onclick: (e) => {
        lang = code;
        [...langSwitch.children].forEach((b) => b.classList.toggle('active', b === e.target));
        mountCanvas();
      },
    }, [label]));
  }

  // ── metadata (titles, slugs, SEO) stays a form: it isn't part of the canvas
  const metaCard = el('div', { class: 'card', style: 'margin-top:18px' }, [el('h3', { html: 'Metadati' })]);
  const metaCols = el('div', { class: 'lang-cols', style: 'margin-top:14px' });
  for (const code of ['it', 'en']) {
    const col = el('div', { class: 'lang-col' }, [el('h4', { html: code === 'it' ? 'Italiano' : 'English' })]);
    col.append(field('Titolo', draft[code].title, (v) => { draft[code].title = v; dirty = true; }));
    col.append(field('Slug (URL)', draft[code].slug, (v) => { draft[code].slug = v; dirty = true; }));
    col.append(field('Estratto', draft[code].excerpt, (v) => { draft[code].excerpt = v; dirty = true; }, 'textarea'));
    col.append(field('Meta description (SEO)', draft[code].metaDescription, (v) => { draft[code].metaDescription = v; dirty = true; }, 'textarea'));
    col.append(field('Testo alternativo immagine', draft[code].imageAlt, (v) => { draft[code].imageAlt = v; dirty = true; }));
    col.append(field('Data', draft[code].dateLabel, (v) => { draft[code].dateLabel = v; dirty = true; }));
    col.append(field('Riferimenti normativi (testo | link | coda)',
      draft.references?.[code] ?? '', (v) => {
        draft.references = draft.references || {}; draft.references[code] = v; dirty = true;
      }));
    metaCols.append(col);
  }
  metaCard.append(metaCols);

  // publish state — new posts start as drafts and generate no pages until this is on
  const pubCard = el('div', { class: 'card' });
  const pubCb = el('input', { type: 'checkbox', id: 'pubToggle', style: 'width:auto;margin-right:9px' });
  pubCb.checked = draft.published !== false;
  const pubHint = el('p', { class: 'meta', style: 'margin-top:6px' });
  const syncHint = () => {
    pubHint.innerHTML = pubCb.checked
      ? 'Pubblicato: le pagine IT ed EN vengono generate e compaiono su /blog.'
      : '<strong>Bozza</strong>: nessuna pagina viene generata e l’articolo non compare sul sito.';
  };
  pubCb.addEventListener('change', () => { draft.published = pubCb.checked; dirty = true; saveBtn.disabled = false; syncHint(); });
  syncHint();
  pubCard.append(
    el('div', { style: 'display:flex;align-items:center' }, [
      pubCb, el('label', { for: 'pubToggle', style: 'font-size:15px;font-weight:500' }, ['Pubblicato']),
    ]),
    pubHint,
  );

  const sidebarCard = el('div', { class: 'card' }, [
    el('h3', { html: 'Barra laterale' }),
    el('p', { class: 'meta', style: 'margin-bottom:12px',
      html: 'L’indice si genera dai titoli delle sezioni. Il riquadro contatti è fisso.' }),
  ]);
  sidebarCard.append(el('div', { class: 'row-2' }, [
    field('Servizio collegato', draft.service, (v) => { draft.service = v; dirty = true; },
      'select', ['energie-rinnovabili', 'coperture', 'bonifica-amianto']),
    field('Link riferimenti normativi', draft.references?.url ?? '', (v) => {
      draft.references = draft.references || {}; draft.references.url = v; dirty = true;
    }),
  ]));

  const saveBtn = el('button', { class: 'btn btn-primary' }, ['Salva e rigenera']);
  saveBtn.disabled = !isNew;   // a new post is savable straight away
  const translateBtn = el('button', { class: 'btn btn-ghost' }, ['Genera versione inglese']);

  const foot = el('div', { class: 'editor-foot' }, [
    saveBtn, translateBtn,
    el('button', {
      class: 'btn btn-ghost',
      onclick: () => {
        // a brand-new post that was never saved should not linger in the list
        if (isNew && !confirm('Scartare il nuovo articolo?')) return;
        if (isNew) postsDoc.posts = postsDoc.posts.filter((p) => p.id !== draft.id);
        else if (!confirmLeave()) return;
        render();
      },
    }, ['Annulla']),
  ]);
  if (!isNew) {
    foot.append(el('button', {
      class: 'btn btn-danger btn-sm', style: 'margin-left:auto',
      onclick: async () => {
        if (!confirm(`Eliminare “${draft.it.title.replace(/&mdash;/g, '—')}”?\n\nLe pagine IT ed EN verranno rimosse dal sito.`)) return;
        postsDoc.posts = postsDoc.posts.filter((p) => p.id !== draft.id);
        try {
          const r = await api('content?type=posts', { method: 'PUT', body: { data: postsDoc } });
          alert(`Articolo eliminato. Pagine rimosse: ${r.removed?.length || 0}`);
          render();
        } catch (err) { alert(err.message); }
      },
    }, ['Elimina articolo']));
  }
  work.append(pubCard, metaCard, sidebarCard, foot);
  mountCanvas();

  // ── translation ─────────────────────────────────────────────────────────
  translateBtn.addEventListener('click', async () => {
    if (!confirm('Sovrascrivere la versione inglese con una traduzione automatica dall’italiano?')) return;
    translateBtn.disabled = true;
    translateBtn.innerHTML = '<span class="spinner"></span> Traduzione…';
    msg.className = 'msg';
    // Collect every translatable string in a fixed order, translate, put back.
    const slots = [];
    const src = draft.it, dst = draft.en;
    slots.push([src, 'lead', dst]);
    for (const key of ['title', 'excerpt', 'metaDescription', 'imageAlt', 'inlineCaption']) slots.push([src, key, dst]);
    src.sections.forEach((sec, i) => {
      const dsec = dst.sections[i];
      if (!dsec) return;
      slots.push([sec, 'heading', dsec]);
      sec.blocks.forEach((b, j) => {
        const db = dsec.blocks[j];
        if (!db) return;
        if (b.type === 'p' || b.type === 'quote') slots.push([b, 'html', db]);
        if (b.type === 'rates' || b.type === 'icons') {
          b.items.forEach((it, k) => {
            const dit = db.items?.[k];
            if (dit) slots.push([it, b.type === 'rates' ? 'label' : 'label', dit]);
          });
        }
      });
    });
    try {
      const texts = slots.map(([o, k]) => o[k] ?? '');
      const r = await api('translate', { method: 'POST', body: { texts } });
      if (!r.configured) {
        msg.className = 'msg err show';
        msg.innerHTML = `Traduzione non configurata: manca <code class="env">${r.missing.join('</code> <code class="env">')}</code>.<br>`
          + r.setup.map(esc).join('<br>');
        return;
      }
      r.translations.forEach((t, i) => { const [, key, target] = slots[i]; target[key] = t; });
      dirty = true; saveBtn.disabled = false;
      msg.className = 'msg ok show';
      msg.textContent = `Tradotti ${r.translations.length} segmenti. Rivedi la versione inglese prima di salvare.`;
      if (lang === 'en') mountCanvas();
    } catch (err) {
      msg.className = 'msg err show'; msg.textContent = err.message;
    } finally {
      translateBtn.disabled = false; translateBtn.textContent = 'Genera versione inglese';
    }
  });

  // ── save ────────────────────────────────────────────────────────────────
  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner"></span> Salvataggio…';
    msg.className = 'msg';
    try {
      const idx = postsDoc.posts.findIndex((p) => p.id === post.id);
      if (idx >= 0) postsDoc.posts[idx] = draft; else postsDoc.posts.unshift(draft);
      const r = await api('content?type=posts', { method: 'PUT', body: { data: postsDoc } });
      dirty = false;
      msg.className = 'msg ok show';
      msg.innerHTML = `Salvato. Rigenerate ${r.regenerated.length} pagine`
        + (r.removed?.length ? `, rimosse ${r.removed.length}` : '')
        + (r.commit ? ` · commit <code class="env">${r.commit}</code>` : '')
        + (r.note ? ` · ${esc(r.note)}` : '');
    } catch (err) {
      msg.className = 'msg err show'; msg.textContent = err.message;
    } finally { saveBtn.textContent = 'Salva e rigenera'; saveBtn.disabled = false; }
  });
}

function field(label, value, onInput, kind = 'input', options = []) {
  const wrap = el('div', { class: 'field' }, [el('label', { class: 'f', html: label })]);
  let input;
  if (kind === 'select') {
    input = el('select', { class: 'f' });
    for (const o of options) input.append(el('option', { value: o, selected: o === value ? '' : null }, [o]));
  } else if (kind === 'textarea') {
    input = el('textarea', { class: 'f' });
    input.value = value ?? '';
  } else {
    input = el('input', { class: 'f', type: 'text' });
    input.value = value ?? '';
  }
  input.addEventListener('input', () => onInput(input.value));
  input.addEventListener('change', () => onInput(input.value));
  wrap.append(input);
  return wrap;
}

          el('div', { class: 'meta', style: 'margin-top:12px', html:
            `H1 ${r.headings.h1} · H2 ${r.headings.h2} · H3 ${r.headings.h3}`
            + ` · immagini ${r.images.total} (${r.images.altCoverage ?? 0}% con alt)`
            + `<br>dati strutturati ${flag(r.structuredData)} · canonical ${flag(r.canonical)}`
            + ` · Open Graph ${flag(r.openGraph.title)} · hreflang ${r.hreflang.length}` }),
          r.headings.h2Text.length ? el('div', { style: 'margin-top:12px' }, [
            el('div', { class: 'aside-label', html: 'Come struttura la pagina' }),
            ...r.headings.h2Text.map((t) => el('div', { class: 'issue', style: 'padding-left:14px', html: esc(t) })),
          ]) : null,
        ]));
      } catch (err) {
        compOut.append(el('div', { class: 'msg err show', html: esc(err.message) }));
      } finally { compBtn.disabled = false; compBtn.textContent = 'Analizza pagina'; }
    });

    // live Lighthouse check, if a key is configured
    const psi = el('div', { class: 'card' }, [
      el('h3', { html: 'Analisi della pagina pubblicata' }),
      el('p', { class: 'meta', style: 'margin-top:4px',
        html: 'Esegue Google PageSpeed Insights su un URL pubblico (SEO, prestazioni, accessibilità).' }),
    ]);
    const input = el('input', { class: 'f', type: 'url', placeholder: 'https://…', style: 'margin-top:12px' });
    const runBtn = el('button', { class: 'btn btn-ghost btn-sm', style: 'margin-top:10px' }, ['Analizza']);
    const outBox = el('div', { style: 'margin-top:14px' });
    psi.append(input, runBtn, outBox);
    body.append(psi);

    runBtn.addEventListener('click', async () => {
      if (!input.value) return;
      runBtn.disabled = true; runBtn.innerHTML = '<span class="spinner"></span> Analisi…';
      outBox.innerHTML = '';
      try {
        const r = await api(`seo?url=${encodeURIComponent(input.value)}`);
        if (!r.configured) {
          outBox.append(el('div', { class: 'msg err show',
            html: `Non configurato: manca <code class="env">${r.missing.join('</code> <code class="env">')}</code>` }));
          outBox.append(el('ul', { class: 'setup-list', html: r.setup.map((x) => `<li>${esc(x)}</li>`).join('') }));
          return;
        }
        if (r.error) { outBox.append(el('div', { class: 'msg err show', html: esc(r.error) })); return; }
        outBox.append(el('div', { class: 'stat-grid' }, [
          stat('SEO', String(r.scores.seo)), stat('Prestazioni', String(r.scores.performance)),
          stat('Accessibilità', String(r.scores.accessibility)), stat('Best practices', String(r.scores.bestPractices)),
        ]));
        for (const f of r.failing) outBox.append(el('div', { class: 'issue warn', html: esc(f.title) }));
      } catch (err) {
        outBox.append(el('div', { class: 'msg err show', html: esc(err.message) }));
      } finally { runBtn.disabled = false; runBtn.textContent = 'Analizza'; }
    });
  } catch (err) { failed(body, err); }
};

// ── marketing ──────────────────────────────────────────────────────────────
VIEWS.marketing = async (root) => {
  header(root, 'Andamento', 'Dati di ricerca organica da Google Search Console.');
  const body = el('div'); root.append(body); loading(body);
  try {
    const d = await api('search-console?days=28');
    body.innerHTML = '';
    if (!d.configured) {
      body.append(el('div', { class: 'card' }, [
        el('h3', { html: 'Google Search Console non è ancora collegato' }),
        el('p', { class: 'meta', style: 'margin-top:4px',
          html: `Mancano: ${d.missing.map((m) => `<code class="env">${m}</code>`).join(' ')}` }),
        el('ul', { class: 'setup-list', html: d.setup.map((s) => `<li>${esc(s)}</li>`).join('') }),
      ]));
      body.append(el('div', { class: 'stat-grid' }, ['Click', 'Impression', 'CTR', 'Posizione media']
        .map((k) => el('div', { class: 'stat' }, [
          el('div', { class: 'k', html: k }), el('div', { class: 'v muted', html: '—' })]))));
      return;
    }
    if (d.error) { failed(body, new Error(d.error)); return; }
    const t = d.totals;
    body.append(el('div', { class: 'stat-grid' }, [
      stat('Click', t.clicks?.toLocaleString('it-IT') ?? '0'),
      stat('Impression', t.impressions?.toLocaleString('it-IT') ?? '0'),
      stat('CTR', `${((t.ctr || 0) * 100).toFixed(1)}%`),
      stat('Posizione media', (t.position || 0).toFixed(1)),
    ]));
    const rows = d.rows.map((r) => `<tr><td style="padding:7px 0">${esc(r.key)}</td>
      <td style="text-align:right">${r.clicks}</td><td style="text-align:right">${r.impressions}</td>
      <td style="text-align:right">${(r.ctr * 100).toFixed(1)}%</td>
      <td style="text-align:right">${r.position.toFixed(1)}</td></tr>`).join('');
    body.append(el('div', { class: 'card' }, [
      el('h3', { html: `Query principali · ultimi ${d.days} giorni` }),
      el('div', { style: 'overflow-x:auto;margin-top:12px' }, [el('table', {
        style: 'width:100%;border-collapse:collapse;font-size:13.5px',
        html: `<thead><tr style="text-align:left;color:var(--text-light);font-size:11px;
                 letter-spacing:1px;text-transform:uppercase">
               <th style="padding-bottom:8px">Query</th><th style="text-align:right">Click</th>
               <th style="text-align:right">Impr.</th><th style="text-align:right">CTR</th>
               <th style="text-align:right">Pos.</th></tr></thead><tbody>${rows}</tbody>`,
      })]),
    ]));
  } catch (err) { failed(body, err); }
};
const stat = (k, v) => el('div', { class: 'stat' }, [el('div', { class: 'k', html: k }), el('div', { class: 'v', html: v })]);

VIEWS.connections = async (root) => {
  header(root, 'Connessioni', 'Ogni piattaforma è collegata solo quando le sue credenziali sono presenti nell’ambiente.');
  const body = el('div'); root.append(body); loading(body);
  try {
    const { platforms, connectedCount } = await api('integrations');
    body.innerHTML = '';
    body.append(el('p', { class: 'meta', style: 'margin-bottom:16px',
      html: `${connectedCount} di ${platforms.length} collegate` }));
    const grid = el('div', { class: 'conn-grid' });
    for (const p of platforms) {
      grid.append(el('div', { class: 'card' }, [
        el('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:10px' }, [
          el('h3', { html: esc(p.name) }),
          el('span', { class: `status ${p.connected ? 'on' : 'off'}`, html: p.connected ? 'Collegato' : 'Non collegato' }),
        ]),
        el('p', { class: 'meta', style: 'margin-top:6px', html: esc(p.metrics) }),
        el('p', { class: 'meta', style: 'margin-top:10px',
          html: p.connected ? '' : `Variabili mancanti: ${p.missing.map((m) => `<code class="env">${m}</code>`).join(' ')}` }),
        p.connected ? null : el('ul', { class: 'setup-list', html: p.steps.map((s) => `<li>${esc(s)}</li>`).join('') }),
        el('p', { class: 'meta', style: 'margin-top:10px;font-style:italic', html: esc(p.effort) }),
      ]));
    }
    body.append(grid);
  } catch (err) { failed(body, err); }
};

function failed(parent, err) {
  parent.innerHTML = '';
  if (err.status === 401) { showGate('Sessione scaduta. Accedi di nuovo.'); return; }
  parent.append(el('div', { class: 'msg err show', html: esc(err.message) }));
}

// ── boot ───────────────────────────────────────────────────────────────────
(async () => {
  try {
    const s = await api('session');
    if (!s.configured) { showGate('Admin non configurato su questo deployment.'); return; }
    s.authenticated ? showApp() : showGate();
  } catch {
    showGate('API non raggiungibile. L’admin richiede le funzioni serverless (vercel dev o un deploy su Vercel).');
  }
})();
</script>
